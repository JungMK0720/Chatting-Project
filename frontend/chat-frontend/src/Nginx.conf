http {
  server {
    listen 80;
    server_name server-name;

    location / {
      return 301 https://$host/$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name server-name;

    ssl_certificate /path/fullchain.pem;
    ssl_certificate_key /path/privkey.pem;

    location / {
      proxy_pass localhost:8080;
      proxy_set_header Host $host;
       
    }
  }
}